services:
  mongo:
    image: mongo:7
    container_name: meditrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - meditrack-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meditrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.example
    environment:
      - MONGO_URI=mongodb://mongo:27017/meditrack
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - meditrack-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meditrack-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - meditrack-net

volumes:
  mongo_data:

networks:
  meditrack-net:
    driver: bridge
