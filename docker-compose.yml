services:
  mongo:
    image: mongo:7
    container_name: meditrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - meditrack-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meditrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/meditrack
      - PORT=5000
      - FRONTEND_URL=http://localhost:4200
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - meditrack-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meditrack-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - meditrack-net

volumes:
  mongo_data:
    driver: local

networks:
  meditrack-net:
    driver: bridge
